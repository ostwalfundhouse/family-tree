<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Family Tree</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Mukta:wght@400;500;600&family=Rozha+One&display=swap">
<style>
/* Layout: one full-screen chart surface; a slim bar on top, a drawer (side on desktop, bottom sheet on phone) for everything else. */
:root{
  --paper:#F4F5F9; --surface:#FFFFFF; --ink:#191D3A; --sub:#5A6082; --line:#9097B4; --rule:#D9DCE8;
  --male:#2C7DB6; --female:#CF4C7C; --accent:#D98E0B; --accent-ink:#1F1602; --chrome:#1D2250; --chrome-ink:#F3F4FB; --chrome-sub:#B4B9DC;
  --warn:#B4500F; --blank:#E3E6F0;
  --ui:"Mukta","Segoe UI",system-ui,sans-serif; --display:"Rozha One","Georgia",serif; --chart:"Arimo","Liberation Sans",Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#12152B; --surface:#1B1F40; --ink:#ECEEF9; --sub:#A4AACB; --line:#5C628C; --rule:#2F3460;
  --male:#62B2E8; --female:#F083A9; --accent:#F0B03A; --accent-ink:#1F1602; --chrome:#0C0E20; --chrome-ink:#F3F4FB; --chrome-sub:#A4AACB;
  --warn:#F0A060; --blank:#2A2F58; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#12152B; --surface:#1B1F40; --ink:#ECEEF9; --sub:#A4AACB; --line:#5C628C; --rule:#2F3460;
  --male:#62B2E8; --female:#F083A9; --accent:#F0B03A; --accent-ink:#1F1602; --chrome:#0C0E20; --chrome-ink:#F3F4FB; --chrome-sub:#A4AACB;
  --warn:#F0A060; --blank:#2A2F58; color-scheme:dark }
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.35;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column}
.bar{background:var(--chrome);color:var(--chrome-ink);display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:8px;padding-inline:16px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;margin-right:auto}
.brand-name{font-family:var(--display);font-size:22px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-meta{color:var(--chrome-sub);font-size:13px;white-space:nowrap}
.search{position:relative;flex:1 1 220px;max-width:340px;min-width:0}
.search input{width:100%;height:36px;border-radius:18px;border:1px solid transparent;background:rgba(255,255,255,.12);color:var(--chrome-ink);padding:0 14px;outline:none}
.search input::placeholder{color:var(--chrome-sub)}
.search input:focus-visible{border-color:var(--accent)}
#qres{position:absolute;z-index:30;left:0;right:0;top:40px;margin:0;padding:4px;list-style:none;background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-height:50vh;overflow:auto}
#qres li{padding:7px 10px;border-radius:7px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
#qres li small{color:var(--sub);white-space:nowrap}
#qres li[aria-selected="true"],#qres li:hover{background:var(--blank)}
.tools{display:flex;gap:6px}
.tb{height:36px;padding:0 13px;border-radius:18px;border:1px solid rgba(255,255,255,.22);background:transparent;color:var(--chrome-ink);cursor:pointer;font-weight:500;white-space:nowrap}
.tb:hover{background:rgba(255,255,255,.1)}
.tb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tb .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:12px;line-height:18px;text-align:center}
.tb[aria-pressed="true"] .dot{background:var(--accent-ink);color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv.drag{cursor:grabbing}
.zoom{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:5}
.zb{width:42px;height:42px;border-radius:21px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);font-size:20px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(10,12,40,.15)}
.zb.fit{font-size:12px;font-weight:600}
#crumb{position:absolute;left:16px;top:12px;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:calc(100% - 32px);background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:6px 8px 6px 12px;box-shadow:0 2px 8px rgba(10,12,40,.15)}
#toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;background:var(--chrome);color:var(--chrome-ink);padding:9px 16px;border-radius:20px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.btn{height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.small{height:30px;padding:0 10px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}
#panel{position:absolute;z-index:10;top:0;right:0;bottom:0;width:min(370px,100%);background:var(--surface);border-left:1px solid var(--rule);display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(10,12,40,.12)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.ph h2{margin:0;font-family:var(--display);font-weight:400;font-size:20px;text-wrap:balance}
#panelBody{padding:14px 16px 24px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:16px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row label{flex:1;min-width:0}
.hint{color:var(--sub);font-size:13.5px;margin:0}
.field{width:100%;height:36px;border-radius:9px;border:1px solid var(--rule);background:var(--paper);padding:0 10px}
select.field{padding:0 6px}
input[type=checkbox].sw{appearance:none;width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
input[type=checkbox].sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:transform .15s}
input[type=checkbox].sw:checked{background:var(--accent)}
input[type=checkbox].sw:checked::after{transform:translateX(18px)}
.who{display:flex;gap:14px;align-items:center}
.who canvas{width:84px;height:84px;flex:none}
.who .nm{font-weight:600;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.kv dt{color:var(--sub)} .kv dd{margin:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--paper);border-radius:15px;padding:3px 11px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--line)}
.chip i.M{background:var(--male)} .chip i.F{background:var(--female)}
.issues{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.issues li{border-left:3px solid var(--warn);padding:2px 0 2px 10px}
.issues button{border:0;background:none;color:var(--accent);padding:0;cursor:pointer;text-decoration:underline}
table.cols{border-collapse:collapse;width:100%;font-size:13.5px}
table.cols td{border-top:1px solid var(--rule);padding:4px 6px 4px 0;vertical-align:top}
table.cols td:first-child{font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:640px){
  .bar{padding-block:8px}
  .brand-meta{display:none}
  .brand-name{font-size:19px}
  .search{order:3;flex-basis:100%;max-width:none}
  .tb{padding:0 11px}
  #panel{top:auto;left:0;width:100%;max-height:68%;border-left:0;border-top:1px solid var(--rule);border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(10,12,40,.2);padding-bottom:env(safe-area-inset-bottom,0px)}
  .zoom{bottom:12px;right:12px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
[hidden]{display:none!important}
</style>
<div id="app">
  <header class="bar">
    <div class="brand"><span class="brand-name" id="brandName">Family Tree</span><span class="brand-meta" id="brandMeta"></span></div>
    <div class="search" role="search">
      <input id="q" type="search" placeholder="Find a person" autocomplete="off" aria-label="Find a person by name" aria-controls="qres">
      <ul id="qres" role="listbox" hidden></ul>
    </div>
    <nav class="tools" aria-label="Chart tools">
      <button class="tb" id="bOptions" aria-pressed="false">Options</button>
      <button class="tb" id="bData" aria-pressed="false">Data<span class="dot" id="issueDot" hidden></span></button>
      <button class="tb" id="bExport" aria-pressed="false">Export</button>
    </nav>
  </header>
  <main id="stage">
    <canvas id="cv" tabindex="0" aria-label="Circular family tree. Drag to move, pinch or scroll to zoom, tap a person for details."></canvas>
    <div id="crumb" hidden><span id="crumbText"></span><button class="btn small" id="crumbBack">Whole family</button></div>
    <div class="zoom">
      <button class="zb" id="zIn" aria-label="Zoom in">+</button>
      <button class="zb" id="zOut" aria-label="Zoom out">&minus;</button>
      <button class="zb fit" id="zFit" aria-label="Fit the whole chart">Fit</button>
    </div>
    <aside id="panel" hidden aria-labelledby="panelTitle">
      <div class="ph"><h2 id="panelTitle"></h2><button class="btn small" id="panelClose">Close</button></div>
      <div id="panelBody"></div>
    </aside>
    <div id="toast" role="status" hidden></div>
  </main>
</div>
<input type="file" id="fSheet" accept=".xlsx,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
<input type="file" id="fPhotos" accept="image/*" multiple hidden>
<script type="module" src="js/viewer-boot.js"></script>
